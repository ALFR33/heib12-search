<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a73e8;
            margin: 0 0 5px 0;
            font-size: 32px;
        }
        .header p {
            color: #5f6368;
            margin: 0;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 12px 22px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 500;
        }
        .quick-links {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quick-links a {
            background: #fff;
            border: 1px solid #dadce0;
            padding: 6px 14px;
            border-radius: 16px;
            color: #3c4043;
            text-decoration: none;
            font-size: 13px;
        }
        .results-container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #dfe1e5;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .card h3 {
            margin: 0 0 6px 0;
            font-size: 17px;
        }
        .card h3 a {
            color: #1a0dab;
            text-decoration: none;
        }
        .card h3 a:hover {
            text-decoration: underline;
        }
        .card .url {
            color: #202124;
            font-size: 12px;
            direction: ltr;
            text-align: right;
            margin-bottom: 6px;
        }
        .card p {
            color: #4d5156;
            font-size: 14px;
            margin: 0;
        }
        .status-msg {
            text-align: center;
            color: #70757a;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث الويب السريع</p>
    </div>

    <form class="search-box" onsubmit="handleSearch(event)">
        <input type="text" id="searchInput" placeholder="ابحث في الويب أو الأخبار..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="quick-links" id="webEngines" style="display:none;">
        <a id="googleLink" target="_blank">بحث في Google ↗</a>
        <a id="newsLink" target="_blank">الأخبار المباشرة ↗</a>
    </div>

    <div class="results-container" id="results"></div>

    <script>
        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const webEngines = document.getElementById('webEngines');
            const googleLink = document.getElementById('googleLink');
            const newsLink = document.getElementById('newsLink');

            if (!query) return;

            // تحديث روابط البحث المباشر
            googleLink.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            newsLink.href = `https://news.google.com/search?q=${encodeURIComponent(query)}`;
            webEngines.style.display = 'flex';

            resultsDiv.innerHTML = '<p class="status-msg">جاري جلب نتائج الويب...</p>';

            try {
                // جلب نتائج الويب والتعريفات الفورية عبر DuckDuckGo API
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&pretty=1&origin=*`;
                const response = await fetch(url);
                const data = await response.json();

                let html = '';

                // إذا توفر ملخص أو إجابة مباشرة
                if (data.AbstractText) {
                    html += `
                        <div class="card">
                            <h3><a href="${data.AbstractURL}" target="_blank">${data.Heading}</a></h3>
                            <div class="url">${data.AbstractURL}</div>
                            <p>${data.AbstractText}</p>
                        </div>
                    `;
                }

                // عرض نتائج الروابط والموضوعات ذات الصلة
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.slice(0, 6).forEach(topic => {
                        if (topic.Text && topic.FirstURL) {
                            html += `
                                <div class="card">
                                    <h3><a href="${topic.FirstURL}" target="_blank">${topic.Text.split(' - ')[0]}</a></h3>
                                    <div class="url">${topic.FirstURL}</div>
                                    <p>${topic.Text}</p>
                                </div>
                            `;
                        }
                    });
                }

                if (!html) {
                    resultsDiv.innerHTML = `
                        <div class="card" style="text-align:center;">
                            <p>لا توجد نتائج سريعة مباشرة لهذه الكلمة.</p>
                            <p style="margin-top:10px;"><a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="color:#1a73e8; font-weight:bold;">انقر هنا للبحث عن "${query}" على الويب بالكامل &larr;</a></p>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = html;
                }

            } catch (error) {
                resultsDiv.innerHTML = '<p class="status-msg">تعذر تحميل النتائج الفورية. استخدم روابط البحث المباشر بالأعلى.</p>';
            }
        }
    </script>

</body>
</html>
