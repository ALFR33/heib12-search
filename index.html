<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a73e8;
            margin: 0 0 5px 0;
            font-size: 32px;
        }
        .header p {
            color: #5f6368;
            margin: 0;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #dfe4ea;
            border-radius: 30px;
            outline: none;
            background: white;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 14px 26px;
            font-size: 16px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .results-container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 15px;
            border: 1px solid #e8eaed;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .card h3 a {
            color: #1a0dab;
            text-decoration: none;
        }
        .card h3 a:hover {
            text-decoration: underline;
        }
        .card p {
            color: #4d5156;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
        .status-msg {
            text-align: center;
            color: #70757a;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث الويب والأخبار المباشر</p>
    </div>

    <form class="search-box" onsubmit="performSearch(event)">
        <input type="text" id="searchInput" placeholder="اكتب للبحث في الويب والأخبار..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري البحث...</p>';

            try {
                const url = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                const items = data.query.search;

                if (!items || items.length === 0) {
                    resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على نتائج. جرب كلمة بحث أخرى.</p>';
                    return;
                }

                let html = '';
                items.forEach(item => {
                    const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                    const link = `https://ar.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                    html += `
                        <div class="card">
                            <h3><a href="${link}" target="_blank">${item.title}</a></h3>
                            <p>${cleanSnippet}...</p>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = html;
            } catch (err) {
                resultsDiv.innerHTML = '<p class="status-msg">حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.</p>';
            }
        }
    </script>

</body>
</html>
