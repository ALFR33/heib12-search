
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Heib12</title>
<style>
body{font-family:'Segoe UI';margin:0;background:#fff;text-align:center;padding-top:60px}
.logo{font-size:85px;font-weight:bold;color:#1a73e8}.logo span{color:#ea4335}
.search{width:90%;max-width:580px;margin:25px auto;border:1px solid #dfe1e5;border-radius:24px;padding:12px 20px;display:flex}
.search input{flex:1;border:none;outline:none;font-size:17px}
.btn{padding:10px 22px;margin:5px;background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;cursor:pointer}
.results{max-width:800px;margin:30px auto;text-align:right;padding:0 20px}
.card{margin-bottom:22px}.card a{font-size:20px;color:#1a0dab;text-decoration:none}
.url{color:#006621;font-size:14px}.desc{color:#4d5156;font-size:14px}
.cat{background:#e8f0fe;color:#1a73e8;padding:3px 10px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
    <div class="logo">Heib<span>12</span></div>
    <form onsubmit="search(event)">
        <div class="search"><input id="q" placeholder="ابحث في Heib12"></div>
        <button class="btn" type="submit">بحث Heib12</button>
    </form>
    <div id="res" class="results"></div>

<script>
let DB = [
{"c":"صحة","t":"علاج الصداع في 5 دقايق","u":"#page1","d":"وصفات طبيعية للتخلص من الصداع بدون دواء","k":"صداع راس علاج"},
{"c":"دين","t":"تفسير سورة الفاتحة كامل","u":"#page2","d":"تفسير مبسط لسورة الفاتحة مع اسباب النزول","k":"قران تفسير دين"},
{"c":"برمجة","t":"تعلم بايثون من الصفر","u":"#page3","d":"كورس بايثون كامل للمبتدئين مع 50 مشروع","k":"برمجة بايثون كود"},
{"c":"أخبار","t":"اخر اخبار الاقتصاد اليوم","u":"#page4","d":"اسعار الدولار والذهب والبورصة لحظة بلحظة","k":"اخبار اقتصاد مال"},
{"c":"تعليم","t":"كيف تذاكر وتنجح بتفوق","u":"#page5","d":"7 طرق علمية للمذاكرة السريعة والحفظ","k":"تعليم دراسة مذاكرة"}
];
// هنا بنولد 1995 نتيجة زيادة تلقائي
for(let i=6; i<=2000; i++){
    DB.push({c:"عام",t:`مقال رقم ${i} عن الصحة والتقنية`,u:`#page${i}`,d:`وصف للمقال رقم ${i}. معلومات قيمة عن الصحة والتعليم`,k:"صحة تقنية تعليم"});
}

function search(e){
    e.preventDefault();
    let q = document.getElementById('q').value.toLowerCase().trim();
    let results = DB.filter(s => s.t.includes(q) || s.k.includes(q) || s.d.includes(q)).slice(0,50);
    let html = results.length ? `<p style="color:#70757a">حوالي ${results.length} نتيجة</p>` : 'لم نجد نتائج';
    html += results.map(r=>`<div class="card"><span class="cat">${r.c}</span><div class="url">heib12.com${r.u}</div><a href="${r.u}">${r.t}</a><p class="desc">${r.d}</p></div>`).join('');
    document.getElementById('res').innerHTML = html;
}
</script>
</body>
</html>
