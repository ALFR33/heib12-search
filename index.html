<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search - المحرك العالمي الشامل</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-top: 30px; margin-bottom: 20px; }
        .header h1 { color: #1a73e8; margin: 0 0 5px 0; font-size: 32px; font-weight: bold; }
        .header p { color: #5f6368; margin: 0; font-size: 14px; }
        .search-box { display: flex; width: 100%; max-width: 600px; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 20px; font-size: 16px; border: 2px solid #dfe1e5; border-radius: 25px; outline: none; background: #fff; box-shadow: 0 1px 6px rgba(32,33,36,0.1); }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { padding: 14px 24px; font-size: 16px; background-color: #1a73e8; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .results-container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #dfe1e5; }
        .card h3 { margin: 0 0 8px 0; font-size: 18px; }
        .card h3 a { color: #1a0dab; text-decoration: none; }
        .card h3 a:hover { text-decoration: underline; }
        .card p { color: #4d5156; font-size: 14px; line-height: 1.6; margin: 0; }
        .status-msg { text-align: center; color: #70757a; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك البحث العالمي والذكي - ابحث عن أي شيء في الإنترنت</p>
    </div>

    <form class="search-box" onsubmit="performSearch(event)">
        <input type="text" id="searchInput" placeholder="اكتب أي شيء للبحث في العالم..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        // القاعدة المحلية السريعة لأبرز المواقع والمنصات الشهيرة
        const localDatabase = [
            { title: "فيسبوك (Facebook)", url: "https://www.facebook.com", keywords: "تواصل اجتماعي أصدقاء صور منشورات فيس بوك" },
            { title: "تيك توك (TikTok)", url: "https://www.tiktok.com", keywords: "فيديوهات قصيرة ترفيه ترندات مقاطع تيك توك" },
            { title: "إنستغرام (Instagram)", url: "https://www.instagram.com", keywords: "صور تواصل مشاركة قصص ريلز انستقرام" },
            { title: "منصة إكس (Twitter سابقاً)", url: "https://twitter.com", keywords: "تواصل اجتماعي تغريدات أخبار لحظية تويتر إكس" },
            { title: "يوتيوب (YouTube)", url: "https://www.youtube.com", keywords: "فيديوهات ترفيه تعليم موسيقى مقاطع يوتيوب" },
            { title: "جوجل (Google)", url: "https://www.google.com", keywords: "بحث معلومات خدمات جوجل search" },
            { title: "ويكيبيديا الموسوعة الحرة", url: "https://ar.wikipedia.org", keywords: "معلومات عامة موسوعة تاريخ ثقافي" },
            { title: "GitHub", url: "https://github.com", keywords: "برمجة أكواد مشاريع مطورين بايثون جافاسكريبت" },
            { title: "موقع كووورة الرياضي", url: "https://www.kooora.com", keywords: "رياضة مباريات دوري أهداف كرة قدم كووورة" },
            { title: "بي إن سبورت (beIN SPORTS)", url: "https://www.beinsports.com", keywords: "قنوات رياضة مباريات بث مباشر بطولات" },
            { title: "مجلة فوربس الشرق الأوسط", url: "https://www.forbesmiddleeast.com", keywords: "اقتصاد ريادة أعمال أموال أثرياء مجلة فوربس" },
            { title: "ناشيونال جيوغرافيك العربية", url: "https://www.nationalgeographicarabic.com", keywords: "طبيعة حيوانات استكشاف علم وثائقي مجلة" },
            { title: "أمازون (Amazon)", url: "https://www.amazon.com", keywords: "تسوق إلكتروني بيع شراء أمازون" },
            { title: "نون (Noon)", url: "https://www.noon.com", keywords: "تسوق إلكتروني توصيل نون" }
        ];

        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري البحث في شبكة الإنترنت...</p>';

            let html = '';
            let foundMatch = false;

            // 1. البحث أولاً في القاعدة المحلية السريعة الخاصة بك
            const matches = localDatabase.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase()) || 
                item.keywords.toLowerCase().includes(query.toLowerCase())
            );

            if (matches.length > 0) {
                foundMatch = true;
                matches.forEach(item => {
                    html += `
                        <div class="card" style="border-right: 4px solid #1a73e8;">
                            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                            <p><strong>الكلمات المفتاحية:</strong> ${item.keywords}</p>
                            <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${item.url}</p>
                        </div>
                    `;
                });
            }

            // 2. البحث الحي الشامل في شبكة الإنترنت عبر جلب النتائج المفتوحة (تغطية أي شيء يبحث عنه المستخدم)
            try {
                const apiURL = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const response = await fetch(apiURL);
                const data = await response.json();
                const items = data.query.search;

                if (items && items.length > 0) {
                    foundMatch = true;
                    items.forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const link = `https://ar.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        html += `
                            <div class="card">
                               <h3><a href="${link}" target="_blank">${item.title}</a></h3>
                               <p>${cleanSnippet}...</p>
                               <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${link}</p>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                // تجاهل خطأ الشبكة المؤقت إن وجد والاعتماد على النتائج المحلية
            }

            if (!foundMatch) {
                resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على نتائج مطابقة لبحثك في شبكة الإنترنت.</p>';
            } else {
                resultsDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
