<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search - المحرك الذكي التلقائي</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-top: 30px; margin-bottom: 20px; }
        .header h1 { color: #1a73e8; margin: 0 0 5px 0; font-size: 32px; font-weight: bold; }
        .header p { color: #5f6368; margin: 0; font-size: 14px; }
        .search-box { display: flex; width: 100%; max-width: 600px; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 20px; font-size: 16px; border: 2px solid #dfe1e5; border-radius: 25px; outline: none; background: #fff; box-shadow: 0 1px 6px rgba(32,33,36,0.1); }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { padding: 14px 24px; font-size: 16px; background-color: #1a73e8; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .results-container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #dfe1e5; border-right: 4px solid #1a73e8; }
        .card h3 { margin: 0 0 8px 0; font-size: 18px; }
        .card h3 a { color: #1a0dab; text-decoration: none; }
        .card h3 a:hover { text-decoration: underline; }
        .card p { color: #4d5156; font-size: 14px; line-height: 1.6; margin: 0; }
        .status-msg { text-align: center; color: #70757a; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك البحث العالمي التلقائي - يغطي ملايين المواضيع والفوائد والعلوم</p>
    </div>

    <form class="search-box" onsubmit="performSearch(event)">
        <input type="text" id="searchInput" placeholder="ابحث عن أي شيء في العالم (قرآن، أخبار، فضاء، علاجات)..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        // 1. القائمة التوجيهية الخاصة بك (لتوجيه الزائر للفوائد والعلوم الشرعية أولاً)
        const priorityDatabase = [
            { title: "القرآن الكريم (موقع آيات)", url: "https://quran.ksu.edu.sa", keywords: "القرآن الكريم تلاوة تفسير مصحف آيات" },
            { title: "الدرر السنية (الأحاديث النبوية الصحيحة)", url: "https://www.dorar.net/hadith", keywords: "حديث نبوي صحيح سنة ضعيف الأحاديث" },
            { title: "حصن المسلم (الأذكار والأدعية)", url: "https://www.hisnmuslim.com", keywords: "أذكار الصباح المساء حصن المسلم أدعية" },
            { title: "موسوعة الأعشاب والطب البديل والعلاجات", url: "https://mawdoo3.com/تصفح/الأعشاب_والطب_البديل", keywords: "علاجات طبيعية أعشاب طب بديل فوائد صحية عشبة" }
        ];

        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري الفهرسة وجلب النتائج التلقائية...</p>';

            let html = '';
            let resultsCount = 0;

            // أوداً: فحص القائمة التوجيهية الخاصة بك لعرضها في المقدمة
            const matches = priorityDatabase.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase()) || 
                item.keywords.toLowerCase().includes(query.toLowerCase())
            );

            matches.forEach(item => {
                resultsCount++;
                html += `
                    <div class="card" style="border-right-color: #28a745;">
                        <h3><a href="${item.url}" target="_blank">${item.title} ⭐ (موصى به)</a></h3>
                        <p><strong>التصنيف:</strong> ${item.keywords}</p>
                        <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${item.url}</p>
                    </div>
                `;
            });

            // ثانياً: جلب النتائج التلقائية الشاملة من الويب عبر الـ API (لتوليد آلاف النتائج فوراً)
            try {
                const apiURL = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const response = await fetch(apiURL);
                const data = await response.json();
                const items = data.query.search;

                if (items && items.length > 0) {
                    items.forEach(item => {
                        resultsCount++;
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const link = `https://ar.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        html += `
                            <div class="card">
                                <h3><a href="${link}" target="_blank">${item.title}</a></h3>
                                <p>${cleanSnippet}...</p>
                                <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${link}</p>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                // تجاهل خطأ الاتصال المؤقت
            }

            if (resultsCount === 0) {
                resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على نتائج مطابقة لبحثك.</p>';
            } else {
                resultsDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
