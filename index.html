<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #dfe4ea;
            border-radius: 25px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results-container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .card h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }
        .card p {
            color: #555;
            font-size: 15px;
        }
        .card a {
            display: inline-block;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .status-msg {
            text-align: center;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث سريع ومباشر</p>
    </div>

    <form class="search-box" onsubmit="handleSearch(event)">
        <input type="text" id="searchInput" placeholder="اكتب ما تبحث عنه هنا..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري البحث...</p>';

            try {
                // جلب ملخص المقال عبر REST API لويكيبيديا العربية
                const url = `https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Not found');
                }

                const data = await response.json();

                resultsDiv.innerHTML = `
                    <div class="card">
                        <h2>${data.title}</h2>
                        ${data.thumbnail ? `<img src="${data.thumbnail.source}" alt="${data.title}">` : ''}
                        <p>${data.extract || 'لا يوجد ملخص متاح لهذا الموضوع.'}</p>
                        ${data.content_urls ? `<a href="${data.content_urls.desktop.page}" target="_blank">قراءة المقال بالكامل &larr;</a>` : ''}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على ملخص مباشر. جرب كتابة عنوان أدق.</p>';
            }
        }
    </script>

</body>
</html>
