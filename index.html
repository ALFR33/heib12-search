<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heib12 Search</title>
    <style>
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            margin-top: 30px;
            margin-bottom: 5px;
        }
        p.sub {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-area {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        #searchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #1a73e8;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #000000;
            display: block;
            margin-bottom: 12px;
        }
        #searchBtn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #results {
            width: 100%;
            max-width: 500px;
            margin: 20px auto 0 auto;
            text-align: right;
        }
        .result-item {
            background: #ffffff;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .result-item h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        .result-item a {
            color: #1a73e8;
            text-decoration: none;
        }
        .result-item p {
            margin: 0;
            color: #444;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Heib12 Search</h1>
    <p class="sub">محرك بحث سريع ومباشر</p>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="المس هنا واكتب ما تريد...">
        <button id="searchBtn" onclick="startSearch()">بحث</button>
    </div>

    <div id="results"></div>

    <script>
        function startSearch() {
            var inputVal = document.getElementById("searchInput").value.trim();
            var resultsBox = document.getElementById("results");

            if (inputVal === "") {
                alert("يرجى كتابة كلمة أولاً");
                return;
            }

            resultsBox.innerHTML = "<p style='text-align:center;'>جاري البحث...</p>";

            var requestUrl = "https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=" + encodeURIComponent(inputVal) + "&format=json&origin=*";

            fetch(requestUrl)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var items = data.query.search;
                    if (!items || items.length === 0) {
                        resultsBox.innerHTML = "<p style='text-align:center;'>لا توجد نتائج.</p>";
                        return;
                    }

                    var htmlContent = "";
                    for (var i = 0; i < items.length; i++) {
                        var title = items[i].title;
                        var snippet = items[i].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        var link = "https://ar.wikipedia.org/wiki/" + encodeURIComponent(title);

                        htmlContent += "<div class='result-item'>" +
                            "<h3><a href='" + link + "' target='_blank'>" + title + "</a></h3>" +
                            "<p>" + snippet + "...</p>" +
                            "</div>";
                    }
                    resultsBox.innerHTML = htmlContent;
                })
                .catch(function(err) {
                    resultsBox.innerHTML = "<p style='text-align:center;'>حدث خطأ، تحقق من الإنترنت.</p>";
                });
        }
    </script>

</body>
</html>
