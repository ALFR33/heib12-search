
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .header {
            text-align: center;
            margin: 10px 0;
        }
        .header h1 {
            color: #1a73e8;
            margin: 0 0 4px 0;
            font-size: 26px;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 8px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
        }
        .frame-container {
            width: 100%;
            max-width: 900px;
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid #dfe1e5;
            overflow: hidden;
            display: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
    </div>

    <form class="search-box" onsubmit="loadResults(event)">
        <input type="text" id="searchInput" placeholder="ابحث في الويب والأخبار هنا..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="frame-container" id="frameBox">
        <iframe id="resultsFrame" name="resultsFrame"></iframe>
    </div>

    <script>
        function loadResults(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const frameBox = document.getElementById('frameBox');
            const frame = document.getElementById('resultsFrame');

            if (query) {
                // فتح نتائج البحث الحية داخل نفس الصفحة دون الخروج منها
                frame.src = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                frameBox.style.display = 'block';
            }
        }
    </script>

</body>
</html>
