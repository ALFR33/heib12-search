<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a73e8;
            margin: 0 0 5px 0;
            font-size: 32px;
        }
        .header p {
            color: #5f6368;
            margin: 0;
            font-size: 14px;
        }
        .search-wrapper {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
            border: 1px solid #dfe1e5;
        }
        /* تحسين مظهر نتائج محرك البحث */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }
        .gsc-search-button-v2 {
            border-radius: 20px !important;
            padding: 10px 20px !important;
            background-color: #1a73e8 !important;
        }
        .gsc-input-box {
            border-radius: 20px !important;
            border: 1px solid #dfe1e5 !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث الويب والأخبار الشامل</p>
    </div>

    <div class="search-wrapper">
        <!-- أداة البحث المباشر عن كل مواقع الإنترنت والأخبار -->
        <script async src="https://cse.google.com/cse.js?cx=partner-pub-5969507963363060:search"></script>
        <div class="gcse-search"></div>
    </div>

</body>
</html>
