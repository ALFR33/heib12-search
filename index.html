<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #1a73e8;
            margin: 0 0 8px 0;
            font-size: 38px;
            font-weight: bold;
        }
        .header p {
            color: #5f6368;
            margin: 0;
            font-size: 15px;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 550px;
            gap: 12px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 22px;
            font-size: 17px;
            border: 2px solid #dfe1e5;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 8px rgba(32,33,36,0.08);
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .btn-web {
            background-color: #1a73e8;
        }
        .btn-news {
            background-color: #ea4335;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث الويب والأخبار الشامل</p>
    </div>

    <form class="search-box" onsubmit="searchWeb(event)">
        <input type="text" id="searchInput" placeholder="اكتب للبحث في الويب أو الأخبار..." required>
        <div class="buttons-group">
            <button type="submit" class="btn-web">بحث في الويب 🌐</button>
            <button type="button" class="btn-news" onclick="searchNews()">الأخبار العاجلة 📰</button>
        </div>
    </form>

    <script>
        function searchWeb(e) {
            if (e) e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
            }
        }

        function searchNews() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                window.location.href = 'https://news.google.com/search?q=' + encodeURIComponent(q);
            }
        }
    </script>

</body>
</html>
