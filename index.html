<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .header p {
            color: #7f8c8d;
            margin: 0;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            font-size: 16px;
            border: 2px solid #dfe4ea;
            border-radius: 25px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results-container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
        }
        .card p {
            color: #555;
            font-size: 14px;
            margin: 0 0 10px 0;
        }
        .card a {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .status-msg {
            text-align: center;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>محرك بحث سريع ومباشر</p>
    </div>

    <form class="search-box" onsubmit="handleSearch(event)">
        <input type="text" id="searchInput" placeholder="اكتب ما تبحث عنه هنا..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        async function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري البحث...</p>';

            try {
                // البحث في عناوين ومقالات ويكيبيديا
                const searchUrl = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();

                const items = searchData.query.search;

                if (!items || items.length === 0) {
                    resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على نتائج. جرب كلمة أخرى.</p>';
                    return;
                }

                // عرض أول 5 نتائج ذات صلة
                let html = '';
                for (let i = 0; i < Math.min(items.length, 5); i++) {
                    const title = items[i].title;
                    const snippet = items[i].snippet.replace(/<\/?[^>]+(>|$)/g, ""); // تنظيف وسوم HTML
                    const pageUrl = `https://ar.wikipedia.org/wiki/${encodeURIComponent(title)}`;

                    html += `
                        <div class="card">
                            <h3>${title}</h3>
                            <p>${snippet}...</p>
                            <a href="${pageUrl}" target="_blank">قراءة المقال كاملاً &larr;</a>
                        </div>
                    `;
                }

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = '<p class="status-msg">حدث خطأ أثناء جلب النتائج. تأكد من اتصال الإنترنت.</p>';
            }
        }
    </script>

</body>
</html>
