
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heib12 Search - المحرك الإسلامي والمعلوماتي الشامل</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-top: 30px; margin-bottom: 20px; }
        .header h1 { color: #1a73e8; margin: 0 0 5px 0; font-size: 32px; font-weight: bold; }
        .header p { color: #5f6368; margin: 0; font-size: 14px; }
        .search-box { display: flex; width: 100%; max-width: 600px; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 20px; font-size: 16px; border: 2px solid #dfe1e5; border-radius: 25px; outline: none; background: #fff; box-shadow: 0 1px 6px rgba(32,33,36,0.1); }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { padding: 14px 24px; font-size: 16px; background-color: #1a73e8; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .results-container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #dfe1e5; border-right: 4px solid #1a73e8; }
        .card h3 { margin: 0 0 8px 0; font-size: 18px; }
        .card h3 a { color: #1a0dab; text-decoration: none; }
        .card h3 a:hover { text-decoration: underline; }
        .card p { color: #4d5156; font-size: 14px; line-height: 1.6; margin: 0; }
        .status-msg { text-align: center; color: #70757a; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heib12 Search</h1>
        <p>المحرك الشامل للعلوم الشرعية، المقالات، الفوائد والعلاجات، وأخبار العالم</p>
    </div>

    <form class="search-box" onsubmit="performSearch(event)">
        <input type="text" id="searchInput" placeholder="ابحث عن القرآن، الأحاديث، الأذكار، العلاجات، أو أي موضوع..." required>
        <button type="submit">بحث</button>
    </form>

    <div class="results-container" id="results"></div>

    <script>
        // قاعدة البيانات الشاملة: (العلوم الشرعية، موقع موضوع، الفوائد، العلاجات، والوكالات العالمية)
        const localDatabase = [
            // القرآن الكريم والعلوم الشرعية والأذكار
            { title: "القرآن الكريم (موقع آيات / مصحف المدينة)", url: "https://quran.ksu.edu.sa", keywords: "القرآن الكريم تلاوة تفسير مصحف آيات" },
            { title: "الدرر السنية (الأحاديث النبوية الصحيحة)", url: "https://www.dorar.net/hadith", keywords: "حديث نبوي صحيح سنة ضعيف بحث الأحاديث الشريفة" },
            { title: "حصن المسلم (الأذكار والأدعية)", url: "https://www.hisnmuslim.com", keywords: "أذكار الصباح المساء حصن المسلم أدعية حصن حصين" },
            { title: "موقع الإسلام سؤال وجواب", url: "https://islamqa.info", keywords: "فتاوى أحكام شرعية إسلام سؤال وجواب ديني" },
            { title: "رئاسة شؤون الحرمين الشريفين", url: "https://gph.gov.sa", keywords: "الحرم المكي الحرم النبوي بث مباشر إمام" },

            // موقع موضوع والمقالات العامة الشاملة
            { title: "موسوعة موقع موضوع (جميع المقالات)", url: "https://mawdoo3.com", keywords: "موضوع مقالات معلومات عامة صحة طب تسبيح تفسير" },
            { title: "موقع ويكيبيديا الموسوعة الحرة", url: "https://ar.wikipedia.org", keywords: "معلومات عامة تاريخ ثقافي معرفة ويكيبيديا" },

            // الفوائد، الأعشاب، والعلاجات الطبية الطبيعية
            { title: "موسوعة الأعشاب والطب البديل (موضوع)", url: "https://mawdoo3.com/تصفح/الأعشاب_والطب_البديل", keywords: "علاجات طبيعية أعشاب طب بديل فوائد صحية عشبة" },
            { title: "فوائد التغذية والأغذية الشافية", url: "https://mawdoo3.com/فوائد_الأغذية_والعلاجات", keywords: "فوائد صحية علاج الأمراض طب نبوي وعلاجات منزلية" },
            { title: "موقع الطبي (استشارات وعلاجات طبية)", url: "https://www.altibbi.com", keywords: "أطباء صحة علاج أمراض استشارات طبية" },

            // الوكالات والصحف العالمية الكبرى (متعددة اللغات)
            { title: "الجزيرة نت", url: "https://www.aljazeera.net", keywords: "أخبار سياسة تقارير الجزيرة مباشر" },
            { title: "BBC News (English)", url: "https://www.bbc.com/news", keywords: "أخبار إنجليزية عاجلة بريطانيا world news" },
            { title: "RT (روسيا اليوم)", url: "https://russian.rt.com", keywords: "أخبار روسيا سياسة عاجل" },
            { title: "وكالة الأناضول (تركيا)", url: "https://www.aa.com.tr", keywords: "تركيا أخبار عاجلة وكالة الأناضول" },
            { title: "فرانس 24 (France 24)", url: "https://www.france24.com/fr", keywords: "فرنسا أوروبا أخبار عالمية" },

            // شبكات التواصل الاجتماعي الكبرى
            { title: "يوتيوب (YouTube)", url: "https://www.youtube.com", keywords: "فيديوهات ترفيه تعليم مقاطع يوتيوب" },
            { title: "فيسبوك (Facebook)", url: "https://www.facebook.com", keywords: "تواصل اجتماعي أصدقاء منشورات فيس بوك" },
            { title: "تيك توك (TikTok)", url: "https://www.tiktok.com", keywords: "فيديوهات قصيرة ترندات تيك توك" },
            { title: "منصة إكس (Twitter سابقاً)", url: "https://twitter.com", keywords: "تواصل اجتماعي تغريدات أخبار إكس" }
        ];

        async function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            if (!query) return;

            resultsDiv.innerHTML = '<p class="status-msg">جاري البحث في المصادر الشرعية والعالمية...</p>';

            let html = '';
            let foundMatch = false;

            // 1. البحث في القاعدة المحلية الشاملة
            const matches = localDatabase.filter(item => 
                item.title.toLowerCase().includes(query.toLowerCase()) || 
                item.keywords.toLowerCase().includes(query.toLowerCase())
            );

            if (matches.length > 0) {
                foundMatch = true;
                matches.forEach(item => {
                    html += `
                        <div class="card">
                            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                            <p><strong>التصنيف والكلمات:</strong> ${item.keywords}</p>
                            <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${item.url}</p>
                        </div>
                    `;
                });
            }

            // 2. البحث الحي الشامل في الويب لضمان شمولية النتائج لأي استعلام إضافي
            try {
                const apiURL = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const response = await fetch(apiURL);
                const data = await response.json();
                const items = data.query.search;

                if (items && items.length > 0) {
                    foundMatch = true;
                    items.forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const link = `https://ar.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        html += `
                            <div class="card">
                                <h3><a href="${link}" target="_blank">${item.title}</a></h3>
                                <p>${cleanSnippet}...</p>
                                <p style="color:#006621; font-size:12px; margin-top:5px; direction: ltr; text-align: right;">${link}</p>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                // تجاوز الخطأ في حال انقطاع الشبكة
            }

            if (!foundMatch) {
                resultsDiv.innerHTML = '<p class="status-msg">لم يتم العثور على نتائج مطابقة لبحثك.</p>';
            } else {
                resultsDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
